[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [{ name = "mi2valley", email = "monocoin189@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "pydantic>=2.12.4,<3.0.0",
    "fastapi[standard]>=0.121.1,<0.122.0",
    "qiskit[qasm3-import]>=2.2.3,<3.0.0",
    "uvicorn[standard]>=0.38.0,<0.39.0",
    "python-jose[cryptography]>=3.5.0,<4.0.0",
    "bcrypt==4.0.1",
    "uuid-utils>=0.11.1,<0.12.0",
    "passlib>=1.7.4,<2.0.0",
    "gunicorn>=23.0.0,<24.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "qiskit-aer>=0.17.2,<0.18.0",
    "qiskit-ibm-runtime>=0.44.0,<0.45.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.4,<0.15.0",
    "mypy>=1.18.2,<2.0.0",
    "pre-commit>=4.4.0,<5.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pyright>=1.1.407,<2.0.0",
    "jupyter>=1.1.1,<2.0.0",
    "matplotlib>=3.10.7,<4.0.0",
    "pylatexenc>=2.10,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.pyright]
include = ["src"]
exclude = [".*", "__*", "**/typings", "*.ipynb"]
ignore = []
defineConstant = { DEBUG = true }
venvPath = "."
venv = ".venv"
reportMissingModuleSource = "none"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
lint.extend-select = []
lint.fixable = ["ALL"]
lint.ignore = []
lint.select = ["E", "F", "N", "I"]
lint.unfixable = ["F401"]
line-length = 119
target-version = "py313"
